name: Refresh PWA tooling

on:
  push:
    branches: [ai/product-completion/PWA]
    paths:
      - .github/workflows/tooling-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ai/product-completion/PWA
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Move Vite and PWA tooling to maintained lines
        run: npm install --save-dev --save-exact vite@8.3.0 vite-plugin-pwa@1.3.0
      - name: Apply remaining non-breaking audit fixes
        run: npm audit fix
      - name: Audit full dependency graph
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified tooling state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit'
            exit 0
          fi
          git commit -m 'build: refresh verified PWA tooling'
          git push origin HEAD:ai/product-completion/PWA
