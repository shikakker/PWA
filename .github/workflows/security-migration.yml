name: Security migration

on:
  push:
    branches:
      - ai/product-completion/PWA
    paths:
      - .github/workflows/security-migration.yml

permissions:
  contents: write

jobs:
  migrate-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: ai/product-completion/PWA
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Remove build-only Workbox packages from runtime dependencies
        run: npm uninstall workbox-build workbox-core workbox-precaching
      - name: Upgrade runtime router security boundary
        run: npm install --save-exact @vaadin/router@2.0.1
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: PWA contracts
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit synchronized manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes to commit'
            exit 0
          fi
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package.json package-lock.json
          git commit -m 'fix: harden PWA runtime dependencies'
          git push origin HEAD:ai/product-completion/PWA
